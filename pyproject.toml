[project]
name = "swallow-evaluation-instruct-private"
version = "0.0.1"
description = "beta"
readme = "README.md"
requires-python = "==3.11.10"
dependencies = []


[project.optional-dependencies]
auto_detector = [
  # "transformers>=5.3.0",
  "transformers>=5.5.0",
  "sentencepiece",
  "protobuf",
]

aggregate_results = [
    "pandas>=2.2.3",
]

lighteval = [
    "lighteval[math,extended_tasks,litellm,vllm]",
    # "transformers>=4.51.0", # Set the floor to allow evaluation of the latest models
    "transformers>=5.5.0",
    "openai>=1.40.0", # Set the floor to avoid using deprecated names.
    "datasets>=3.6.0,<4.0.0", # Set the floor to prevent uv from downgrading to v2, and the ceiling to avoid breaking changes
    "litellm>=1.75.8", # Set the ceiling to support gpt-oss
]

# API経由のモデル（OpenRouter・OpenAIなど）のみを評価する場合に使う軽量版．
# vLLM を含まないため GPU が不要で，インストール時間およびディスク使用量を大幅に削減できる．
lighteval_api = [
    "lighteval[math,extended_tasks,litellm]",
    "transformers>=5.5.0",
    "openai>=1.40.0",
    "datasets>=3.6.0,<4.0.0",
    "litellm>=1.75.8",
]

vllm = [
  # "vllm==0.18.0", # Set the ceiling to support gpt-oss
  "vllm==0.19.1",
]


[tool.hatch.metadata]
allow-direct-references = true


[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

lighteval = { path = "./lighteval", editable = true }


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"


[tool.uv]
conflicts = [
  [
    { extra = "auto_detector" },
    { extra = "aggregate_results" },
    { extra = "lighteval" },
    { extra = "lighteval_api" },
    { extra = "vllm" },
  ],
]
index-strategy = "unsafe-best-match"


[tool.ruff]
ignore = ["F841", "E741"]
fix = true
